# readme.md §8 — everything the document reports, reproducible from here.
#
#   cargo run --release -- list       # every command and the section it produces
#   cargo run --release -- --help     # that, plus §10.3's parameters as flags
#
# `readme.md` §10.2 maps every section to the command that produces it, and
# `tests/references.rs` fails the build if that table and `list` disagree.
#
# One dependency, and it parses the command line. Nothing a reported figure
# passes through touches a crate.
[package]
name = "contrapunctus"
# 0.1.1 because the engine writes different music than 0.1.0 did: an edit used
# to refill only the blocks it touched, pinning the last of them to what the
# piece sounded before the edit, and that pin was history a settings file cannot
# carry. Files written by 0.1.0 that were edited before saving will say so on
# load, which is exactly what the fingerprint is for.
version = "0.1.1"
edition = "2021"
publish = false

# The model and the generator, for anything built on top — a user interface,
# another program. `readme.md` §10.6 says what is in it.
[lib]
name = "contrapunctus"
path = "src/lib.rs"

# The measurements. Every figure in §8 comes out of this, and `list` maps each
# section to the command that produces it.
[[bin]]
name = "contrapunctus"
path = "src/main.rs"

[features]
# Settings files — `Design`, `Layout`, tier and seed, as JSON. Off by default so
# that the measurement binary still passes through no crate at all, which is
# what `readme.md` §10.5 claims and what makes §8's figures reproducible from
# this source alone. The interface turns it on.
serde = ["dep:serde", "dep:serde_json"]
# The 24 fugues and the annotations, compiled in — about 295 kB. For a build
# with no filesystem, which is any build in a browser. Needs the submodules.
embedded-corpus = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# A clock, and only where there is not one. `std::time::Instant` compiles for
# `wasm32-unknown-unknown` and panics when called, so a browser build needs
# `web-time` in its place — and a native build does not compile this at all,
# which is why §10.5's claim about §8's figures is untouched: the measurement
# binary is never built for `wasm32`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[profile.release]
debug = false

# `ricercar/` declares its own workspace; `corpus/` holds submodules.
#
# `ui/` is the interface — `docs/ui-spec.md`. It is a member rather than part of
# this package because it depends on `eframe`, and the point of §10.5's claim is
# that this package's figures do not. `cargo build` here still builds only the
# measurements; `cargo build --workspace` builds both.
[workspace]
members = ["ui"]
exclude = ["ricercar", "corpus"]
