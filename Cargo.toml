# readme.md §8 — everything the document reports, reproducible from here.
#
#   cargo run --release -- states     # the automaton's reachable state count
#   cargo run --release -- verdict    # the three tests the roughness field failed
#   cargo run --release -- corpus     # how often Bach violates the rulebook
#   cargo run --release -- stretto    # BWV 867's five entries as a clique
#   cargo run --release -- sweep      # the harmonic analyser, penalty swept
#   cargo run --release -- realise    # the fill, the measurement, and out/*.mid
#
# `readme.md` §10.2 maps every section to the command that produces it.
[package]
name = "contrapunctus"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[profile.release]
debug = false

# `ricercar/` declares its own workspace; `corpus/` holds submodules.
[workspace]
exclude = ["ricercar", "corpus"]
