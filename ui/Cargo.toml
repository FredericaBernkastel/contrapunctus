# The Contrapunctus Workbench — `docs/ui-spec.md`.
#
# Separate from the library's own package on purpose. §10.5 claims that no
# figure reported in readme §8 passes through a crate, and that claim is only
# checkable if the package producing those figures does not depend on `eframe`.
# The dependency arrow points this way and never back.
[package]
name = "contrapunctus-ui"
version = "0.1.0"
edition = "2021"
publish = false
# The `worker` target below is a second binary, and a package with two of them
# leaves `cargo run` unable to choose. It is never run on the desktop — `trunk`
# builds it into a second wasm and a browser starts it — so the workbench is
# what `run` means here.
default-run = "contrapunctus-ui"

[[bin]]
name = "contrapunctus-ui"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[features]
default = []
# Play through a system MIDI port instead of the built-in synth — spec 6.3.
midi-out = ["dep:midir"]

[dependencies]
# `serde` for settings files, `embedded-corpus` so a browser build has the 24
# subjects without a network fetch — spec 7.1.
contrapunctus = { path = "..", features = ["serde", "embedded-corpus"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36"
# File dialogs. `rfd`'s async API is the one that exists on both targets — a
# native dialog on the desktop, a file input and a download in a browser — so
# spec 7.2 says always to use it and never the blocking form.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# The sound card. Spec 6.2 wants the built-in synth as the default because it
# is the one that always works, and `cpal` targets WebAudio on wasm32 as well
# as the desktop APIs, so it is one dependency and not two.
cpal = "0.18"
# A clock that exists on both targets. `std::time::Instant` compiles for wasm
# and panics when called, which is how the browser build first came up as a
# stack trace; `eframe` already depends on this, so it costs nothing.
web-time = "1"
# The worker's messages are JSON, because `settings::Settings` already is —
# spec 7.3, and it is the same content section 8 saves to a file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# System MIDI out — spec 6.3, and behind a feature so a build without it has no
# dependency at all. `midir` is one crate on every desktop API and Web MIDI on
# wasm, which is why the section names it rather than three platform crates.
midir = { version = "0.11", optional = true }

# A future has to be driven by something, and that something is the one part of
# this crate that cannot be written once: a browser has no threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# The entry point: a canvas to draw on, and something to hand the future to.
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Document", "Window", "Element", "HtmlCanvasElement",
  # The generating worker — spec 7.3.
  "Worker", "WorkerOptions", "WorkerType", "DedicatedWorkerGlobalScope", "MessageEvent", "Blob", "BlobPropertyBag", "Url",
] }
js-sys = "0.3"
# `cpal` reaches WebAudio through wasm-bindgen rather than through a system API.
cpal = { version = "0.18", features = ["wasm-bindgen"] }
